<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Fraunces:ital,wght@1,400;1,500&display=swap');

:root{
  --navy:#001F3F; --gold:#F5B301; --paper:#FAF7F2; --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--navy); color:var(--white); overflow:hidden; position:relative;
}
/* quiet constellation motif, one corner, low opacity */
.constellation{position:absolute;inset:0;opacity:.16;pointer-events:none}
.dot{position:absolute;background:var(--gold);border-radius:50%}
.smile{position:absolute;border:2px solid var(--gold);border-top:none;border-left:none;
  border-right:none;border-radius:0 0 60px 60px;height:40px}

.wrap{position:relative;height:100%;display:flex;flex-direction:column;
  align-items:center;padding:90px 80px 72px;text-align:center}

.logo{width:300px;height:auto} /* 2.6:1 mark — scale by ONE dimension */

.eyebrow{margin-top:40px;font-weight:500;font-size:24px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold)}

.headline{font-weight:700;font-size:66px;line-height:1.1;margin-top:22px;
  max-width:860px;letter-spacing:-.02em}

.quote{font-family:'Fraunces',serif;font-style:italic;font-weight:400;
  font-size:34px;color:rgba(255,255,255,.82);margin-top:26px}

.games{display:flex;gap:28px;margin-top:56px}
.tile{width:132px;height:132px;background:rgba(255,255,255,.06);
  border:1px solid rgba(245,179,1,.35);border-radius:20px;padding:20px;
  display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}

.cta{margin-top:auto;background:var(--gold);color:var(--navy);
  font-weight:700;font-size:34px;padding:22px 60px;border-radius:14px}
</style>
</head>
<body>
  <div class="constellation">
    <div class="dot" style="width:14px;height:14px;top:120px;left:90px"></div>
    <div class="dot" style="width:10px;height:10px;top:180px;left:150px"></div>
    <div class="smile" style="width:70px;top:150px;left:104px"></div>
    <div class="dot" style="width:12px;height:12px;top:90px;right:120px"></div>
    <div class="dot" style="width:9px;height:9px;top:150px;right:170px"></div>
    <div class="smile" style="width:60px;top:118px;right:132px"></div>
  </div>

  <div class="wrap">
    <img class="logo" src="file:///home/aliahmed/Projects/taleemabad/agent-skills-taleemabad/skills/rumi-brand/assets/rumi-mark-white-smile.png" alt="Rumi">
    <div class="eyebrow">Gaming Adda</div>
    <div class="headline">Board game classics,<br>always there when you are.</div>
    <div class="quote">Teaching is lonely. Play doesn't have to be.</div>
    <div class="games">
      <div class="tile"><img src="../../assets/icons/ludo.png"></div>
      <div class="tile"><img src="../../assets/icons/checkers.png"></div>
      <div class="tile"><img src="../../assets/icons/tic_tac_toe.png"></div>
      <div class="tile"><img src="../../assets/icons/card_match.png"></div>
      <div class="tile"><img src="../../assets/icons/stack.png"></div>
    </div>
    <div class="cta">Play free — no sign-up</div>
  </div>
</body>
</html>
